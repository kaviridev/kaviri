<!doctype html><meta charset="utf-8"><title>Record a demo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;font-family:Inter,system-ui,sans-serif;color:#0e1013}
  .card{width:400px;background:#fff;border-radius:16px;padding:26px 28px;box-shadow:0 10px 34px rgba(14,16,19,.10)}
  h1{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
  p{margin:0 0 16px;color:#5b6270;font-size:13px}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;padding:11px 12px;border:1px solid #d7dbe1;border-radius:10px;font:500 14px ui-monospace,Menlo,monospace;color:#0e1013}
  input:focus{outline:2px solid #3ddc97;outline-offset:0;border-color:transparent}
  button{padding:0 16px;border:0;border-radius:10px;background:#0e1013;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
  .out{margin-top:16px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#e9faf2;color:#0e7a4f;font-weight:600;font-size:14px;opacity:0;transform:translateY(6px);transition:all .4s}
  .out.on{opacity:1;transform:none}
  .bar{height:6px;border-radius:3px;background:#d7dbe1;margin-top:16px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:#3ddc97;transition:width 1.1s ease}
</style>
<div class="card">
  <h1>Record a demo</h1>
  <p>A script in, a finished video out.</p>
  <div class="row"><input id="script" placeholder="demo.jsonl" autocomplete="off"><button id="go">Record</button></div>
  <div class="bar" id="bar"><i></i></div>
  <div class="out" id="out">&#10003; demo.mp4 ready, 1080p</div>
</div>
<script>
document.getElementById('go').onclick=function(){
  var b=document.getElementById('bar');b.style.display='block';
  requestAnimationFrame(function(){b.firstChild.style.width='100%'});
  setTimeout(function(){b.style.display='none';document.getElementById('out').classList.add('on')},1200);
};
</script>
