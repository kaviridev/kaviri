[package]
name = "kaviri"
version = "0.1.0"
edition = "2021"
# No feature here needs a recent toolchain, and the whole point of the floor is
# that a distro rustc builds kaviri without a cryptic std error. Keep it low, and
# raise it deliberately rather than by reaching for a new std method.
rust-version = "1.75"
description = "Programmable recording browser: your demo video is a build artifact, remade when the product changes"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/thisisisheanesu/kaviri"
homepage = "https://kaviri.dev"
keywords = ["screencast", "recording", "browser", "cdp", "video"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# SIGINT/SIGTERM have to flip a flag rather than kill the process: every cleanup
# kaviri does (the browser, its profile, the frame spool) lives in a Drop.
signal-hook = { version = "0.3", default-features = false }
# statvfs, to refuse a take that has nowhere to spool, and killpg, because the
# chromium a snap gives us is a wrapper script whose child is the real browser.
libc = "0.2"
# SHA-256, to check a downloaded speech engine or voice against the hash pinned in
# src/tts.rs before it is trusted, and to key the cache of synthesised lines.
sha2 = { version = "0.10", default-features = false }
# `kaviri mcp`, the op protocol as an MCP server. Pinned exactly: the SDK is young
# and has broken its API between minors. It is the one dependency that needs a
# newer rustc (1.88), so it sits behind a default feature, and
# `cargo build --no-default-features` still builds everything else on the floor above.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "fs", "sync", "time"], optional = true }

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio"]

[profile.release]
opt-level = 2
