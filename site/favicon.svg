<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="kaviri">
  <title>kaviri</title>
  <!-- A tile, not a transparent mark: at 16px against browser chrome the tile is what keeps the
       mark legible in both light and dark toolbars. The back frame is drawn at full strength
       here, because at 45% it disappears at this size. -->
  <rect width="32" height="32" rx="7" fill="#0e1013"/>
  <rect x="4.5" y="4.5" width="15" height="15" rx="3.2" fill="none" stroke="#3ddc97" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="10" y="10" width="17.5" height="17.5" rx="3.6" fill="#3ddc97"/>
  <path d="M16.2 14.6V23.2L23.4 18.9Z" fill="#0e1013" stroke="#0e1013" stroke-width="1" stroke-linejoin="round"/>
</svg>
